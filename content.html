  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const videos = document.querySelectorAll('.hover-video, .hover-video1');
        
        videos.forEach(video => {
            video.muted = true;
            video.pause(); 
            
            const container = video.closest('.video-hover') || video.closest('.video-hover1');
            let isPlaying = false;

            async function playVideo() {
                // Ensure we don't try to play twice
                if (video.paused && !isPlaying) {
                    isPlaying = true;
                    video.muted = true;

                    // If the video hasn't loaded data yet, force it
                    if (video.readyState < 2) {
                        video.load();
                    }

                    try {
                        // A tiny delay helps Safari/Arc process the file request
                        await new Promise(resolve => setTimeout(resolve, 50));
                        await video.play();
                    } catch (error) {
                        console.log("Browser blocked or aborted play:", error.name);
                    } finally {
                        isPlaying = false;
                    }
                }
            }

            function pauseVideo() {
                video.pause();
                video.currentTime = 0;
                isPlaying = false;
            }

            // Mouse Events
            container.addEventListener('mouseenter', playVideo);
            container.addEventListener('mouseleave', pauseVideo);
            
            // Touch Events (Mobile Safari)
            container.addEventListener('touchstart', function(e) {
                if (e.target.closest('.click-overlay')) return;
                e.preventDefault();
                if (video.paused) {
                    playVideo();
                } else {
                    pauseVideo();
                }
            }, { passive: false });
        });
    });

    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("show");
    }
  </script>

  <script>
    // Email copy script
    const email = document.getElementById("email");
    const popup = document.getElementById("popup");
    if(email) {
      email.addEventListener("click", function (e) {
          const text = email.textContent;
          navigator.clipboard.writeText(text).then(() => {
              popup.style.left = `${e.pageX + 10}px`;
              popup.style.top = `${e.pageY + 10}px`;
              popup.style.display = "block";
              setTimeout(() => { popup.style.opacity = "1"; }, 10);
              setTimeout(() => {
                  popup.style.opacity = "0";
                  setTimeout(() => { popup.style.display = "none"; }, 300);
              }, 2000);
          });
      });
    }
  </script>
