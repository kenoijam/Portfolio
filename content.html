  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const videos = document.querySelectorAll('.hover-video, .hover-video1');
        
        videos.forEach(video => {
            // Force browser compliance settings
            video.muted = true;
            video.preload = "auto"; 
            
            const container = video.closest('.video-hover') || video.closest('.video-hover1');
            
            // This flag tracks the specific play request to prevent AbortErrors
            let playPromise = null;

            async function playVideo() {
                video.muted = true;
                
                // Wake up the video if it's not ready
                if (video.readyState < 3) {
                    video.load();
                }

                playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Video started successfully
                        playPromise = null;
                    }).catch(error => {
                        if (error.name !== 'AbortError') {
                            console.error("Playback error:", error);
                        }
                        playPromise = null;
                    });
                }
            }

            async function pauseVideo() {
                // If the video is still trying to start, wait for it before pausing
                if (playPromise) {
                    try {
                        await playPromise;
                    } catch (e) {
                        // Ignore errors from the interrupted play
                    }
                }
                video.pause();
                video.currentTime = 0;
            }

            // Desktop Hover
            container.addEventListener('mouseenter', playVideo);
            container.addEventListener('mouseleave', pauseVideo);
            
            // Mobile Touch
            container.addEventListener('touchstart', function(e) {
                if (e.target.closest('.click-overlay')) return;
                e.preventDefault();
                video.paused ? playVideo() : pauseVideo();
            }, { passive: false });
        });
    });

    function toggleMenu() {
        document.getElementById("navLinks").classList.toggle("show");
    }
  </script>
