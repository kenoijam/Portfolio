  <script>
document.addEventListener('DOMContentLoaded', function() {
    const videos = document.querySelectorAll('.hover-video, .hover-video1');
    
    videos.forEach(video => {
        video.muted = true;
        video.preload = "auto"; // Changed to auto for better LFS streaming
        
        const container = video.closest('.video-hover') || video.closest('.video-hover1');
        let isPlaying = false;

        async function playVideo() {
            if (video.paused && !isPlaying) {
                isPlaying = true;
                video.muted = true;

                // Force load if data isn't ready
                if (video.readyState < 2) {
                    video.load();
                }

                try {
                    // Small delay prevents the AbortError in Arc/Safari
                    await new Promise(resolve => setTimeout(resolve, 80));
                    await video.play();
                } catch (error) {
                    console.log("Playback interaction handled:", error.name);
                } finally {
                    isPlaying = false;
                }
            }
        }

        function pauseVideo() {
            video.pause();
            video.currentTime = 0;
            isPlaying = false;
        }

        container.addEventListener('mouseenter', playVideo);
        container.addEventListener('mouseleave', pauseVideo);
        
        // Mobile Support
        container.addEventListener('touchstart', function(e) {
            if (e.target.closest('.click-overlay')) return;
            e.preventDefault();
            video.paused ? playVideo() : pauseVideo();
        }, { passive: false });
    });
});

function toggleMenu() {

}
